services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharos-graphql-server
    working_dir: /usr/src/app
    restart: always
    environment:
      REDISHOST: redis
    volumes:
      - ./src/unfiltered_counts.sqlite:/usr/src/app/src/unfiltered_counts.sqlite
    ports:
      - "8040:4444"
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: redis
